schema: spec-driven

# OpenSpec-Guard: Project Context & Governance Constraints
context: |
  1. Environment Isolation: Scripts and dependencies must run inside isolated project virtual environments (e.g., .venv for Python or local node_modules).
  2. Directory Hygiene: Keep project root clean. Scripts belong in dedicated code directories; documentation belongs in markdown/docs; raw data and artifacts must be separated.
  3. Language & Logging: Production code, identifier names, and console/system logs must be 100% in English to prevent cross-platform encoding crashes.
  4. Config-Driven & Anti-Duplication: Forbid creating redundant duplicate scripts for parameter variants. Abstract single generic production scripts and externalize parameters into `configs/`.
  5. Cleanup Contract: Temporary audit, test, or exploration scripts must be cleaned up immediately upon verification.
  6. Read-Only Independent Audit Gate: Upon completing task implementation, an isolated, zero-memory auditor with STRICTLY DISABLED write tools must evaluate the codebase across 3 distinct dimensions before archiving is permitted.

rules:
  proposal:
    - Clearly define Scope (In-Scope deliverables) and Non-Goals / Out-of-Scope (strict boundary red lines).
    - Identify technical risks, breaking changes, and external dependency constraints.
  specs:
    - Specify observable system behaviors and state transitions.
    - Strictly define input schemas, output structures, and error branches (Gherkin style: Requirement -> Scenario -> WHEN -> THEN).
  design:
    - Document technical architecture, component interactions, and data contracts.
    - Explicitly detail error handling, resource cleanup, and security boundaries.
    - Enforce the Config-Driven principle: specify generic script interfaces and corresponding config file structures, prohibiting duplicate script sprawl.
  tasks:
    - Group tasks logically: Setup -> Implementation -> Verification -> Cleanup.
    - Every task must specify deterministic acceptance criteria and validation checks.
    - Ensure temporary test or scratch scripts include explicit removal steps.

operations:
  apply:
    guidance:
      - Adhere strictly to project virtual environment and language conventions.
      - Upon completing all tasks (100%), automatically trigger the isolated, read-only auditor subagent (`spec-auditor`) with write tools disabled.
      - Persist 3 separate audit dimension reports under `openspec/changes/<change-name>/audits/`.
  archive:
    guidance:
      - Verify that all 3 audit dimension reports under `openspec/changes/<change-name>/audits/` have a clear PASS verdict.
      - Never archive if any audit dimension is marked REJECT or missing.
      - Merge delta specifications into main specs upon archival.
